<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리끼리 골프대회</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="우리끼리">
<meta name="theme-color" content="#14532d">
<style>
:root{--bg:#f6f4ee;--card:#fff;--sand:#ece5d6;--turf:#14532d;--turf-mid:#2a7a51;
 --ink:#16211b;--muted:#657a6f;--line:#ddd7c8;--clay:#a8491c;--shade:rgba(20,40,30,.22);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#101712;--card:#19221c;--sand:#232e26;--turf:#8fd3ab;--turf-mid:#6bbd8e;
 --ink:#e8efe9;--muted:#95a89d;--line:#2d3a32;--clay:#e59a6b;--shade:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#101712;--card:#19221c;--sand:#232e26;--turf:#8fd3ab;
 --turf-mid:#6bbd8e;--ink:#e8efe9;--muted:#95a89d;--line:#2d3a32;--clay:#e59a6b;--shade:rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
 font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:0;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.bar .sub{font-size:12px;color:var(--muted);font-weight:400}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.foot{padding:10px 14px 14px;background:var(--card);border-top:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
p.note{color:var(--muted);font-size:13px;margin:6px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{
 width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);
 border:1px solid var(--line);border-radius:9px}
textarea{min-height:110px;font-size:13px;line-height:1.45;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{
 outline:3px solid var(--turf-mid);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:block;width:100%;padding:15px;border-radius:11px;background:var(--turf);
 color:var(--card);font-weight:650;font-size:17px;text-align:center}
.btn.quiet{background:var(--sand);color:var(--ink);font-weight:550}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.sm{padding:11px;font-size:15px;border-radius:9px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chip{padding:7px 11px;border-radius:999px;background:var(--sand);font-size:13px;font-weight:550;white-space:nowrap}
.chip.on{background:var(--turf);color:var(--card)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.banner{background:var(--turf);color:var(--card);padding:13px 14px;display:flex;align-items:center;gap:10px}
.banner span{flex:1;font-size:14px;font-weight:550}
.banner button{background:var(--card);color:var(--turf);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:650}
.holehead{display:flex;align-items:baseline;gap:12px;padding:14px 14px 8px}
.holenum{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
.holepar{font-size:15px;color:var(--muted);font-weight:600}
.strip{display:flex;gap:3px;padding:0 14px 10px}
.seg{flex:1;height:7px;border-radius:2px;background:var(--sand);border:none;padding:0}
.seg.part{background:var(--clay)}.seg.done{background:var(--turf-mid)}
.seg.cur{box-shadow:0 0 0 2px var(--turf)}
.plr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:7px}
.plr .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.plr .nm{font-weight:650;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plr .hc{font-size:12px;color:var(--muted)}
.plr .st{font-size:12px;color:var(--clay);font-weight:600}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(28px,1fr));gap:4px}
.keys .key{min-height:28px;height:auto;padding:4px 5px;font-size:14px;border-radius:7px;
 white-space:nowrap;overflow:visible}
.key{height:46px;border-radius:9px;background:var(--sand);font-size:17px;font-weight:650;
 display:flex;align-items:center;justify-content:center}
.key.on{background:var(--turf);color:var(--card)}
.key.more{font-size:15px;color:var(--muted)}
.pm{display:flex;align-items:center;gap:8px}
.pm .mbtn{width:56px;height:48px;border-radius:9px;background:var(--sand);font-size:24px;font-weight:650;
 display:flex;align-items:center;justify-content:center}
.pm .val{flex:1;height:48px;border-radius:9px;background:var(--turf);color:var(--card);
 display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.pm .val.pending{background:var(--sand);color:var(--muted)}
.sheet{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;z-index:30}
.sheet .inner{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:16px;
 padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.grid5 .key{height:46px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid3 .key{height:44px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));
 background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:88%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px}
td.win{font-weight:700;color:var(--turf)}
.hx th,.hx td{padding:7px 9px;font-size:13px}
.hx td.u{color:var(--clay)}
.hx th.hid{color:var(--clay);font-weight:700}
.ed input{width:50px;padding:7px 2px;text-align:center;font-size:14px}
.gm{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:none}
.gm .nm{flex:1;font-weight:600}
.gm input[type=number]{width:88px}
.teambox{display:flex;gap:10px}
.teambox>div{flex:1;background:var(--sand);border-radius:10px;padding:10px}
.hero{display:flex;align-items:center;gap:13px;padding:18px 14px;
 background:var(--turf);color:var(--card)}
.hero .crest{width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--turf);
 display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.hero .hname{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hero .hsub{font-size:12.5px;opacity:.85;margin-top:2px}
.ribbon{background:var(--clay);color:#fff;padding:3px 9px;border-radius:999px;
 font-size:11.5px;font-weight:700;flex:none}
.ribbon.done{background:var(--turf-mid)}
.pop{font-size:16px}
tr.gold td{background:var(--turf-soft,rgba(42,122,81,.12));font-weight:700}
tr.gold td:first-child{color:var(--turf)}
.star{font-size:17px}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
 padding:0 3px;font-weight:650;line-height:1}
.mk.bogey{border:1.5px solid var(--ink);border-radius:3px}
.mk.dbl{border:1.5px solid var(--ink);border-radius:3px;box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--ink)}
.mk.birdie{border:1.5px solid var(--turf);border-radius:50%;color:var(--turf)}
.mk.eagle{border:1.5px solid var(--turf);border-radius:50%;color:var(--turf);
 box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--turf)}
.mk.onion{background:var(--clay);color:#fff;border-radius:4px}
.parpick{display:flex;gap:6px;align-items:center;padding:0 14px 10px}
.parpick .lb{font-size:13px;color:var(--muted);flex:none}
.parpick button{flex:1;height:40px;border-radius:9px;background:var(--sand);font-weight:650;font-size:15px}
.parpick button.on{background:var(--turf);color:var(--card)}
@media (prefers-reduced-motion:no-preference){
 .toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(6px)}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var DKEY="woorigolf.data", LKEY="woorigolf.local";
var DEFAULT_CLOUD="https://script.google.com/macros/s/AKfycbyJRHGc_25w-Jg8V-PGaRF19quBMTnazVxvqb2LzD__FkLao57zogtOjgn8gtarJv2P3g/exec";
var S=null,L=null,view={name:"home"},sheet=null,tTimer=null,scan=null,busy=false;

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function blankS(){return{schemaVersion:4,room:null,members:[],rounds:[],hcpWindow:5,updatedAt:null}}
function blankL(){return{mode:"member",inputMode:"numbers",myGroup:{},cloudUrl:"",cloudPw:"",
 lastSaved:null,lastSync:null,lastName:"",seeded:false}}
function load(){
 try{var a=localStorage.getItem(DKEY);S=a?JSON.parse(a):blankS()}catch(e){S=blankS()}
 try{var b=localStorage.getItem(LKEY);L=b?JSON.parse(b):blankL()}catch(e){L=blankL()}
 if(!S||typeof S!=="object")S=blankS();
 if(!S.members)S.members=[];if(!S.rounds)S.rounds=[];
 if(!S.hcpWindow)S.hcpWindow=5;
 if(!L||typeof L!=="object")L=blankL();
 if(!L.myGroup)L.myGroup={};if(!L.mode)L.mode="member";if(!L.inputMode)L.inputMode="numbers";
 if(!L.cloudUrl)L.cloudUrl=DEFAULT_CLOUD;if(L.cloudPw==null)L.cloudPw="";
 S.members.forEach(function(m){if(typeof m.hcpManual!=="number")m.hcpManual=(typeof m.hcp==="number"?m.hcp:0)});
 S.rounds.forEach(function(r){if(!r.grossOnly)r.grossOnly={};if(!r.scores)r.scores={};
  if(!r.times)r.times={};if(!r.games)r.games=[];if(!r.teams)r.teams={}});
}
function save(stamp){
 if(stamp!==false)S.updatedAt=new Date().toISOString();
 L.lastSaved=new Date().toISOString();
 try{localStorage.setItem(DKEY,JSON.stringify(S));localStorage.setItem(LKEY,JSON.stringify(L))}
 catch(e){toast("저장하지 못했습니다. 저장 공간을 확인해 주세요.")}
}
function toast(m){var el=document.createElement("div");el.className="toast";el.textContent=m;
 document.body.appendChild(el);clearTimeout(tTimer);tTimer=setTimeout(function(){el.remove()},3200)}
var askCb=null;
function ask(msg,yes,label){
 askCb=yes;
 sheet='<div class="sheet"><div class="inner">'+
  '<p style="white-space:pre-line;margin:0 0 14px;font-size:15px">'+esc(msg)+'</p>'+
  '<button class="btn sm" onclick="askYes()">'+esc(label||"예, 진행합니다")+'</button>'+
  '<div style="height:8px"></div>'+
  '<button class="btn sm quiet" onclick="askNo()">취소</button></div></div>';
 render()}
function askYes(){var f=askCb;askCb=null;sheet=null;render();if(f)f()}
function askNo(){askCb=null;sheet=null;render()}
function go(n,p){view=Object.assign({name:n},p||{});sheet=null;render();window.scrollTo(0,0)}
function p2(n){return n<10?"0"+n:""+n}
function fmt(iso){if(!iso)return "없음";var d=new Date(iso);
 return d.getFullYear()+"."+p2(d.getMonth()+1)+"."+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function won(n){return (n||0).toLocaleString("ko-KR")+"원"}
function sgn(n){return (n>0?"+":"")+n}

var DEFAULT_PARS=[4,4,3,5,4,4,3,4,5,4,3,4,5,4,4,3,5,4];
var STATUS={ok:"",pickup:"픽업",concede:"컨시드",retire:"기권",absent:"미참가"};
var GAMES={
 net:{name:"핸디 적용",desc:"실제 타수에서 그날 핸디를 뺀 값이 적은 사람",asc:true,need:"gross",unit:"타"},
 gross:{name:"스크래치",desc:"실제 타수가 적은 사람",asc:true,need:"gross",unit:"타"},
 improve:{name:"개선상",desc:"직전 참가 라운드보다 많이 줄인 사람",asc:false,need:"gross",unit:"타"},
 perio:{name:"신페리오",desc:"프로그램이 뽑은 열두 홀로 그날 핸디를 만들어 뺀 값",asc:true,need:"hole",unit:"타"},
 dapa:{name:"다파상",desc:"파 이상을 친 홀이 많은 사람",asc:false,need:"hole",unit:"홀"},
 birdie:{name:"버디킹",desc:"버디 이상을 친 홀이 많은 사람",asc:false,need:"hole",unit:"홀"},
 onion:{name:"어니언킹",desc:"양파를 친 홀이 많은 사람",asc:false,need:"hole",unit:"홀"},
 team:{name:"팀전",desc:"팀으로 나누어 개인 점수를 합산",asc:true,need:"gross",unit:""}
};
var GAME_ORDER=["net","gross","improve","perio","dapa","birdie","onion","team"];

function round(id){for(var i=0;i<S.rounds.length;i++)if(S.rounds[i].id===id)return S.rounds[i];return null}
function member(id){for(var i=0;i<S.members.length;i++)if(S.members[i].id===id)return S.members[i];return null}
function mname(id){var m=member(id);return m?m.name:"(알 수 없음)"}
function cell(r,mid,h){return (r.scores[mid]&&r.scores[mid][h])||null}
function setCell(r,mid,h,v){if(!r.scores[mid])r.scores[mid]={};if(v===null)delete r.scores[mid][h];else r.scores[mid][h]=v}
function parOf(r,h){var v=r.pars[h-1];return (typeof v==="number"&&v>=3)?v:0}
function parSum(r){var s=0;for(var i=0;i<r.holeCount;i++)s+=(r.pars[i]||4);return s}
function parsReady(r){for(var h=1;h<=r.holeCount;h++)if(!parOf(r,h))return false;return true}
function holeFilled(r,mid){var n=0;for(var h=1;h<=r.holeCount;h++){var c=cell(r,mid,h);
 if(c&&typeof c.s==="number")n++}return n}
function hasHoles(r,mid){return holeFilled(r,mid)===r.holeCount}
function grossOf(r,mid){
 if(hasHoles(r,mid)){var t=0;for(var h=1;h<=r.holeCount;h++)t+=cell(r,mid,h).s;return t}
 if(r.grossOnly&&typeof r.grossOnly[mid]==="number")return r.grossOnly[mid];
 return null}
function partialOf(r,mid){
 var t=0,n=0;for(var h=1;h<=r.holeCount;h++){var c=cell(r,mid,h);
  if(c&&typeof c.s==="number"){t+=c.s;n++}}
 if(n)return{sum:t,n:n};
 if(r.grossOnly&&typeof r.grossOnly[mid]==="number")return{sum:r.grossOnly[mid],n:r.holeCount};
 return{sum:0,n:0}}
function sortedRounds(){return S.rounds.slice().sort(function(a,b){
 return (a.date||"")<(b.date||"")?-1:((a.date||"")>(b.date||"")?1:0)})}
function priorOf(mid,date,id){
 return sortedRounds().filter(function(r){
  if(r.id===id)return false;
  if((r.date||"")>=date)return false;
  return r.players.indexOf(mid)>=0&&grossOf(r,mid)!=null})}
function hcpAt(mid,date,id){
 var pr=priorOf(mid,date,id),m=member(mid);
 if(!pr.length)return (m&&typeof m.hcpManual==="number")?m.hcpManual:0;
 var ds=pr.map(function(r){return grossOf(r,mid)-parSum(r)});
 if(pr.length===1)return Math.round(ds[0]);
 var w=ds.slice(-(S.hcpWindow||5));
 return Math.round(w.reduce(function(a,b){return a+b},0)/w.length)}
function curHcp(mid){return hcpAt(mid,"9999-12-31",null)}
function roundHcp(r,mid){return hcpAt(mid,r.date,r.id)}
function improveOf(r,mid){
 var pr=priorOf(mid,r.date,r.id);if(!pr.length)return null;
 var g=grossOf(r,mid);if(g==null)return null;
 var last=pr[pr.length-1];
 return (grossOf(last,mid)-parSum(last))-(g-parSum(r))}
function countType(r,mid,type){
 var n=0;
 for(var h=1;h<=r.holeCount;h++){var c=cell(r,mid,h),par=parOf(r,h);
  if(!par)continue;
  if(!c||typeof c.s!=="number")continue;
  if(type==="dapa"&&c.s<=par)n++;
  if(type==="birdie"&&c.s<=par-1)n++;
  if(type==="onion"&&c.s>=par*2)n++}
 return n}
function perioHcp(r,mid){
 if(!r.perio||!r.perio.length||!hasHoles(r,mid))return null;
 var s=0;r.perio.forEach(function(h){s+=cell(r,mid,h).s});
 return Math.round(((s*1.5-parSum(r))*0.8)*10)/10}
function drawPerio(r){
 var a=[];for(var h=1;h<=r.holeCount;h++)a.push(h);
 for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
 var n=Math.min(12,Math.max(4,Math.round(r.holeCount*2/3)));
 r.perio=a.slice(0,n).sort(function(x,y){return x-y});
 return r.perio}
function rankBy(list,asc){
 var a=list.slice().sort(function(x,y){return asc?x.v-y.v:y.v-x.v});
 var rank=0,prev=null,n=0,c={};
 a.forEach(function(x){n++;if(prev===null||x.v!==prev){rank=n;prev=x.v}x.rank=rank});
 a.forEach(function(x){c[x.rank]=(c[x.rank]||0)+1});
 a.forEach(function(x){x.tie=c[x.rank]>1});
 return a}
function gameRows(r,type){
 var g=GAMES[type],out=[];
 r.players.forEach(function(mid){
  var m=member(mid)||{name:"(알 수 없음)"},v=null,ex={};
  if(type==="gross"){v=grossOf(r,mid)}
  else if(type==="net"){var gr=grossOf(r,mid);if(gr!=null){ex.hcp=roundHcp(r,mid);ex.gross=gr;v=gr-ex.hcp}}
  else if(type==="improve"){v=improveOf(r,mid);if(v!=null)ex.gross=grossOf(r,mid)}
  else if(type==="perio"){var gp=grossOf(r,mid),ph=perioHcp(r,mid);
   if(gp!=null&&ph!=null){ex.hcp=ph;ex.gross=gp;v=Math.round((gp-ph)*10)/10}}
  else {if(!hasHoles(r,mid))return;v=countType(r,mid,type)}
  if(v==null)return;
  out.push(Object.assign({mid:mid,name:m.name,v:v},ex))});
 return rankBy(out,g.asc)}
var TEAM_KEYS=["A","B","C","D"];
function teamsOf(r){
 var g={};
 r.players.forEach(function(mid){var t=r.teams&&r.teams[mid];
  if(t&&TEAM_KEYS.indexOf(t)>=0)(g[t]=g[t]||[]).push(mid)});
 return g}
function teamCountOf(r){
 var g=roundGames(r).filter(function(x){return x.type==="team"})[0];
 return (g&&g.teamCount)||2}
function autoTeams(r,n){
 n=n||teamCountOf(r);if(n<2)n=2;if(n>4)n=4;
 var ps=r.players.slice();
 if(ps.length<n){r.teams={};ps.forEach(function(mid,i){r.teams[mid]=TEAM_KEYS[i%n]});return r.teams}
 var H={};ps.forEach(function(mid){H[mid]=curHcp(mid)});
 var big=Math.ceil(ps.length/n),small=Math.floor(ps.length/n);
 var rest=ps.length%n;
 var cap=[];for(var i=0;i<n;i++)cap.push(i<rest?big:small);
 /* 핸디가 큰 사람부터, 자리가 남은 팀 중 합이 가장 작은 곳에 넣는다 */
 var order=ps.slice().sort(function(x,y){return H[y]-H[x]});
 var bucket=[];for(var j=0;j<n;j++)bucket.push([]);
 order.forEach(function(mid){
  var best=-1,bv=Infinity;
  for(var k=0;k<n;k++){
   if(bucket[k].length>=cap[k])continue;
   var sum=0;bucket[k].forEach(function(x){sum+=H[x]});
   if(sum<bv){bv=sum;best=k}}
  if(best<0)best=0;
  bucket[best].push(mid)});
 function sums(){return bucket.map(function(b){var t=0;b.forEach(function(x){t+=H[x]});return t})}
 function spread(){var v=sums();return Math.max.apply(null,v)-Math.min.apply(null,v)}
 /* 두 사람씩 맞바꿔 보며 더 고르게 만든다 */
 for(var pass=0;pass<60;pass++){
  var cur=spread(),done=true;
  for(var a1=0;a1<n&&done;a1++)for(var b1=a1+1;b1<n&&done;b1++)
   for(var x1=0;x1<bucket[a1].length&&done;x1++)for(var y1=0;y1<bucket[b1].length&&done;y1++){
    var t1=bucket[a1][x1],t2=bucket[b1][y1];
    bucket[a1][x1]=t2;bucket[b1][y1]=t1;
    if(spread()<cur-0.0001){done=false}
    else{bucket[a1][x1]=t1;bucket[b1][y1]=t2}}
  if(done)break}
 r.teams={};
 bucket.forEach(function(b,k){b.forEach(function(mid){r.teams[mid]=TEAM_KEYS[k]})});
 return r.teams}
function teamResult(r,g){
 var basis=g.basis||"net",asc=(basis==="net");
 function val(mid){
  if(basis==="net"){var gr=grossOf(r,mid);return gr==null?null:gr-roundHcp(r,mid)}
  return improveOf(r,mid)}
 var grp=teamsOf(r);
 var sides=TEAM_KEYS.filter(function(k){return grp[k]&&grp[k].length}).map(function(k){
  return{key:k,rows:grp[k].map(function(mid){
   return{mid:mid,name:mname(mid),hcp:curHcp(mid),v:val(mid)}})
   .filter(function(x){return x.v!=null})}})
  .filter(function(s){return s.rows.length});
 if(sides.length<2)return null;
 var mx=0;sides.forEach(function(s){if(s.rows.length>mx)mx=s.rows.length});
 sides.forEach(function(s){
  s.rows.forEach(function(x){x.mult=1});
  var d=mx-s.rows.length;if(d<=0)return;
  var byH=s.rows.slice().sort(function(x,y){return x.hcp-y.hcp});
  var m0=Math.floor((byH.length-1)/2);
  for(var k=0;k<d;k++){
   var idx=m0+(k%2===0?Math.ceil(k/2):-Math.ceil(k/2));
   if(idx<0)idx=0;if(idx>=byH.length)idx=byH.length-1;
   byH[idx].mult=(byH[idx].mult||1)+1}});
 sides.forEach(function(s){var t=0;
  s.rows.forEach(function(x){t+=x.v*(x.mult||1)});
  s.total=Math.round(t*10)/10});
 var rk={};
 rankBy(sides.map(function(s){return{key:s.key,v:s.total}}),asc).forEach(function(x){rk[x.key]=x});
 sides.forEach(function(s){s.rank=rk[s.key].rank;s.tie=rk[s.key].tie});
 return{sides:sides,asc:asc,basis:basis}}
function markHtml(sc,par){
 if(typeof sc!=="number")return "-";
 if(!par)return '<span class="mk">'+sc+'</span>';
 var d=sc-par,cls="";
 if(sc>=par*2)cls="onion";
 else if(d>=2)cls="dbl";
 else if(d===1)cls="bogey";
 else if(d===-1)cls="birdie";
 else if(d<=-2)cls="eagle";
 return '<span class="mk '+cls+'">'+sc+'</span>'}
function roundGames(r){return (r.games&&r.games.length)?r.games:[{type:"net",prize:0}]}
function isPlanned(r){return (r.date||"")>today()}
function roundSummary(r){
 var out=[];
 roundGames(r).forEach(function(g){
  var G=GAMES[g.type];if(!G)return;
  if(g.type==="team"){
   var tr=teamResult(r,g);if(!tr)return;
   var w=tr.sides.filter(function(s){return s.rank===1});
   if(w.length)out.push("팀전 "+w.map(function(s){return s.key+"팀"}).join("·"));
   return}
  var rows=gameRows(r,g.type);if(!rows.length)return;
  var w2=rows.filter(function(x){return x.rank===1});
  if(w2.length)out.push(G.name+" "+w2.map(function(x){return x.name}).join("·"))});
 return out.join(" · ")}
function roundNo(r){var rs=sortedRounds();
 for(var i=0;i<rs.length;i++)if(rs[i].id===r.id)return i+1;return rs.length}
function byHcp(list){return list.slice().sort(function(a,b){
 var d=curHcp(a.id)-curHcp(b.id);return d!==0?d:(a.name<b.name?-1:1)})}
function hcpFromList(ds,manual){
 if(!ds.length)return manual||0;
 if(ds.length===1)return Math.round(ds[0]);
 var w=ds.slice(-(S.hcpWindow||5));
 return Math.round(w.reduce(function(a,b){return a+b},0)/w.length)}
/** uptoId까지(포함) 누적. null이면 전체 */
function cumStats(uptoId){
 var rs=sortedRounds(),cut=rs.length;
 if(uptoId){for(var i=0;i<rs.length;i++)if(rs[i].id===uptoId){cut=i+1;break}}
 var use=rs.slice(0,cut);
 return S.members.map(function(m){
  var ds=[],n=0;
  use.forEach(function(r){
   if(r.players.indexOf(m.id)<0)return;
   n++;var v=grossOf(r,m.id);if(v!=null)ds.push(v-parSum(r))});
  var W=S.hcpWindow||5,l=ds.slice(-W);
  return{m:m,played:n,n:ds.length,
   avg:ds.length?ds.reduce(function(a,b){return a+b},0)/ds.length:null,
   avgL:l.length?l.reduce(function(a,b){return a+b},0)/l.length:null,
   best:ds.length?Math.min.apply(null,ds):null,
   hcp:hcpFromList(ds,m.hcpManual)}})
  .sort(function(a,b){var d=a.hcp-b.hcp;return d!==0?d:(a.m.name<b.m.name?-1:1)})}
function cumTable(uptoId,title,note){
 var rows=cumStats(uptoId).filter(function(x){return x.played>0});
 if(!rows.length)return '<div class="card"><h2>'+title+'</h2><div class="empty">아직 기록이 없습니다.</div></div>';
 return '<div class="card"><h2>'+title+'</h2><div class="scroll"><table>'+
  '<thead><tr><th>이름</th><th>핸디</th><th>참가</th><th>전체평균</th><th>최근'+(S.hcpWindow||5)+'</th><th>최저</th></tr></thead><tbody>'+
  rows.map(function(x){return '<tr><td>'+esc(x.m.name)+'</td><td>'+x.hcp+'</td><td>'+x.played+'</td>'+
   '<td>'+(x.avg==null?"-":sgn(Math.round(x.avg*10)/10))+'</td>'+
   '<td>'+(x.avgL==null?"-":sgn(Math.round(x.avgL*10)/10))+'</td>'+
   '<td>'+(x.best==null?"-":sgn(x.best))+'</td></tr>'}).join("")+
  '</tbody></table></div>'+(note?'<p class="note">'+note+'</p>':'')+'</div>'}

/* ===== 창구 ===== */
function cloudOn(){return !!(L.cloudUrl&&/^https:\/\//.test(L.cloudUrl))}
function withTimeout(pr,ms){
 return new Promise(function(ok,no){
  var done=false;
  var t=setTimeout(function(){if(!done){done=true;no(new Error("응답이 없습니다 ("+(ms/1000)+"초 초과)"))}},ms);
  pr.then(function(v){if(!done){done=true;clearTimeout(t);ok(v)}},
   function(e){if(!done){done=true;clearTimeout(t);no(e)}})})}
function cloudGet(action){
 var u=L.cloudUrl+(L.cloudUrl.indexOf("?")>=0?"&":"?")+"action="+action;
 return withTimeout(fetch(u,{method:"GET",redirect:"follow"}).then(function(res){
  return res.text().then(function(t){
   try{return JSON.parse(t)}catch(e){throw new Error("창구가 글자 대신 다른 것을 보냈습니다. "+t.slice(0,80))}})}),20000)}
function cloudPut(name,data){
 return withTimeout(fetch(L.cloudUrl,{method:"POST",redirect:"follow",
  headers:{"Content-Type":"text/plain;charset=utf-8"},
  body:JSON.stringify({pw:L.cloudPw,name:name,data:data})}).then(function(res){
  return res.text().then(function(t){
   try{return JSON.parse(t)}catch(e){throw new Error("창구가 글자 대신 다른 것을 보냈습니다. "+t.slice(0,80))}})}),30000)}
function cloudTest(){
 if(!cloudOn()){toast("먼저 창구 주소를 넣고 저장해 주세요.");return}
 var box=document.getElementById("cbox");
 if(box)box.innerHTML='<p class="note">창구에 말을 걸고 있습니다…</p>';
 cloudGet("ping").then(function(res){
  if(box)box.innerHTML='<p class="note" style="color:var(--turf)">창구가 응답했습니다. '+
   esc(JSON.stringify(res))+'</p>'},
  function(e){
   if(box)box.innerHTML='<p class="note" style="color:var(--clay)">실패했습니다. '+esc(String(e&&e.message||e))+
    '<br>이 화면에서 바깥 주소로 연결하는 것이 막혀 있을 수 있습니다. 프로그램을 자기 주소에 올린 뒤 다시 시험해 보십시오.</p>'})}
function pullCloud(silent){
 if(!cloudOn()){if(!silent)toast("먼저 설정에서 창구 주소를 넣어 주세요.");return}
 if(busy)return;busy=true;if(!silent)toast("받는 중입니다…");
 cloudGet("latest").then(function(res){busy=false;
  if(!res||!res.ok){if(!silent)toast("받지 못했습니다. "+((res&&res.error)||""));return}
  if(!res.name){if(!silent)toast("아직 올라온 기록이 없습니다.");return}
  if(L.lastName===res.name&&S.room){if(!silent)toast("이미 최신입니다.");return}
  var inc;try{inc=JSON.parse(res.data)}catch(e){if(!silent)toast("받은 기록을 읽지 못했습니다.");return}
  ask("경기위원장이 "+fmt(inc.updatedAt||res.updatedAt)+"에 올린 기록이 있습니다.\n회원 "+
   (inc.members||[]).length+"명, 라운드 "+(inc.rounds||[]).length+"회입니다.\n\n받으면 이 폰의 기록은 그것으로 바뀝니다.",
   function(){
    S=inc;if(!S.members)S.members=[];if(!S.rounds)S.rounds=[];if(!S.hcpWindow)S.hcpWindow=5;
    L.lastName=res.name;L.lastSync=new Date().toISOString();
    save(false);go("home");toast("최신 기록을 받았습니다.")},"받기")
 },function(e){busy=false;if(!silent)toast("창구에 닿지 못했습니다. "+String(e&&e.message||e))})}
function pushCloud(){
 if(!cloudOn()){toast("먼저 설정에서 창구 주소를 넣어 주세요.");return}
 if(L.mode!=="host"){toast("경기위원장 모드에서만 올릴 수 있습니다.");return}
 if(!L.cloudPw){toast("설정에서 올리기 암호를 넣어 주세요.");return}

function doPush(){

 },function(e){busy=false;toast("올리지 못했습니다. "+String(e&&e.message||e))})}

function markEnter(){var k=view.rid+"#"+view.hole;if(k!==timeKey){timeKey=k;enterAt=Date.now()}}
function recordTime(){if(!enterAt)return;var r=round(view.rid);if(!r){enterAt=0;return}
 var s=Math.round((Date.now()-enterAt)/100)/10;
 if(s>0&&s<600){var c=r.times[view.hole];r.times[view.hole]=(c==null)?s:Math.min(c,s)}
 enterAt=0;timeKey=null;save()}
function visiblePlayers(r){var g=L.myGroup[r.id];
 if(!g||!r.groupOf)return r.players;
 return r.players.filter(function(mid){return (r.groupOf[mid]||1)===g})}
function scrPlay(){
 var r=round(view.rid);if(!r)return scrHome();
 var h=view.hole||1,par=parOf(r,h),pl=visiblePlayers(r);
 var strip=[];
 for(var i=1;i<=r.holeCount;i++){var f=0;
  pl.forEach(function(mid){if(cell(r,mid,i))f++});
  strip.push('<button class="seg '+(f===0?"":(f===pl.length?"done":"part"))+(i===h?" cur":"")+
   '" onclick="goHole('+i+')"></button>')}
 var picks=[3,4,5,6].map(function(v){
  return '<button class="'+(par===v?"on":"")+'" onclick="setPar('+v+')">파'+v+'</button>'}).join("");
 var rows=pl.map(function(mid){
  var m=member(mid)||{name:"(알 수 없음)"},hc=roundHcp(r,mid),c=cell(r,mid,h);
  var st=c&&c.st&&c.st!=="ok"?STATUS[c.st]:"";
  var lo=par?Math.max(1,par-2):1,hi=par?par+4:7,ks=[];
  for(var v=lo;v<=hi;v++){
   ks.push('<button class="key'+(c&&c.s===v&&(!c.st||c.st==="ok")?" on":"")+
    '" onclick="setScore(\''+mid+'\','+v+')">'+v+'</button>')}
  var out=c&&typeof c.s==="number"&&(c.s<lo||c.s>hi);
  var oth=(out||(c&&c.st&&c.st!=="ok"));
  var lab=out?String(c.s):"\u00b7\u00b7\u00b7";
  var keys='<div class="keys">'+ks.join("")+
   '<button class="key more'+(oth?" on":"")+'" onclick="openSheet(\''+mid+'\')">'+
   lab+'</button></div>';
  var shown=(c&&typeof c.s==="number")?(' '+markHtml(c.s,par)):"";
  return '<div class="plr"><div class="top"><span class="nm">'+esc(m.name)+'</span>'+
   (st?'<span class="st">'+st+'</span>':'')+
   '<span class="hc">핸디 '+hc+'</span>'+shown+'</div>'+keys+'</div>'}).join("");
 var gl=L.myGroup[r.id]?(L.myGroup[r.id]+"조"):"전체";
 return '<div class="screen">'+
 '<div class="bar"><button class="chip" onclick="go(\'result\',{rid:\''+r.id+'\'})">나가기</button>'+
 '<h1>'+(L.mode==="host"?"필드 스코어 입력":"임시 입력")+'<div class="sub">'+
 (L.mode==="host"?"이 기록이 결과에 쓰입니다":"이 폰에만 남습니다")+'</div></h1>'+
 (r.groupCount>1?'<button class="chip" onclick="cycleGroup()">'+gl+'</button>':'')+'</div>'+
 '<div class="holehead"><span class="holenum">'+h+'</span><span class="holepar">'+
 (par?('파 '+par):'파를 먼저 골라 주세요')+'</span></div>'+
 '<div class="parpick"><span class="lb">파</span>'+picks+'</div>'+
 '<div class="strip">'+strip.join("")+'</div>'+
 '<div class="body" style="padding-top:2px">'+rows+
 (par?'<p class="note">버디는 동그라미, 보기는 네모, 더블보기 이상은 겹네모, 양파는 주황으로 표시됩니다.</p>'
  :'<p class="note">파를 고르지 않아도 타수는 넣을 수 있습니다. 다만 파를 넣으셔야 버디킹과 다파상과 어니언킹이 계산됩니다.</p>')+
 '</div>'+
 '<div class="foot"><div class="row2">'+
 (h>1?'<button class="btn quiet" onclick="prevHole()">이전 홀</button>':'')+
 '<button class="btn" onclick="nextHole()">'+(h>=r.holeCount?"마치기":"다음 홀")+'</button></div></div></div>'}
function setPar(v){var r=round(view.rid);
 r.pars[view.hole-1]=(parOf(r,view.hole)===v)?0:v;save();render()}
function cycleGroup(){var r=round(view.rid),n=(L.myGroup[r.id]||0)+1;
 if(n>r.groupCount)n=0;if(n===0)delete L.myGroup[r.id];else L.myGroup[r.id]=n;save(false);render()}
function setScore(mid,v){var r=round(view.rid),c=cell(r,mid,view.hole);
 var st=c&&c.st&&c.st!=="ok"&&c.st!=="retire"&&c.st!=="absent"?c.st:"ok";
 setCell(r,mid,view.hole,{s:v,st:st});save();render()}
function bump(mid,d,b){var v=b+d;if(v<1)v=1;if(v>20)v=20;setScore(mid,v)}
function goHole(h){recordTime();view.hole=h;render()}
function prevHole(){if(view.hole>1)goHole(view.hole-1)}
function nextHole(){var r=round(view.rid);recordTime();
 if(view.hole>=r.holeCount)go("result",{rid:r.id});else{view.hole=view.hole+1;render()}}
function openSheet(mid){
 var r=round(view.rid),m=member(mid)||{name:"회원"},par=parOf(r,view.hole),nums="";
 for(var v=1;v<=15;v++)nums+='<button class="key" onclick="setScore(\''+mid+'\','+v+');closeSheet()">'+v+'</button>';
 sheet='<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="inner">'+
  '<h2 style="margin:0 0 10px;font-size:16px">'+esc(m.name)+' · '+view.hole+'번 홀'+(par?' (파 '+par+')':'')+'</h2>'+
  '<div class="grid5">'+nums+'</div><div class="grid3">'+
  '<button class="key" onclick="setStatus(\''+mid+'\',\'pickup\')">픽업</button>'+
  '<button class="key" onclick="setStatus(\''+mid+'\',\'concede\')">컨시드</button>'+
  '<button class="key" onclick="setStatus(\''+mid+'\',\'retire\')">기권</button>'+
  '<button class="key" onclick="setStatus(\''+mid+'\',\'absent\')">미참가</button>'+
  '<button class="key" onclick="setStatus(\''+mid+'\',null)">지우기</button>'+
  '<button class="key" onclick="closeSheet()">닫기</button></div></div></div>';
 render()}
function closeSheet(){sheet=null;render()}
function setStatus(mid,st){var r=round(view.rid),par=parOf(r,view.hole)||4,c=cell(r,mid,view.hole);
 if(st===null)setCell(r,mid,view.hole,null);
 else if(st==="retire"||st==="absent")setCell(r,mid,view.hole,{s:null,st:st});
 else{var s=c&&typeof c.s==="number"?c.s:par+2;setCell(r,mid,view.hole,{s:s,st:st})}
 save();closeSheet()}

function gameCard(r,g){
 var G=GAMES[g.type];if(!G)return "";
 if(g.type==="team"){
  var tr=teamResult(r,g);
  if(!tr)return '<div class="card"><h2>팀전</h2><div class="empty">두 팀 이상으로 나누고 기록이 들어오면 계산됩니다.</div></div>';
  var ind=rankBy(tr.sides.reduce(function(a,s){
   return a.concat(s.rows.map(function(x){return{mid:x.mid,name:x.name,v:x.v,team:s.key}}))},[]),tr.asc);
  var irk={};ind.forEach(function(x){irk[x.mid]=x});
  var box=tr.sides.map(function(s){
   return '<div'+(s.rank===1?' style="outline:2px solid var(--turf)"':'')+'><div class="mt">'+
    (s.rank===1?'\ud83c\udf1f ':'')+s.key+'팀'+(s.rank===1?(s.tie?" · 공동 1위":" · 우승"):" · "+s.rank+"위")+'</div>'+
    s.rows.map(function(x){return '<div style="font-size:13px">'+esc(x.name)+' '+
     (Math.round(x.v*10)/10)+(x.mult>1?" ×"+x.mult:"")+
     ' <span class="mt">개인 '+irk[x.mid].rank+'위</span></div>'}).join("")+
    '<div style="margin-top:6px;font-weight:700">합계 '+s.total+'</div></div>'}).join("");
  var w=tr.sides.filter(function(s){return s.rank===1});
  var cnt=0;w.forEach(function(s){cnt+=s.rows.length});
  var prize=g.prize?('<p class="note">상금 '+won(g.prize)+' · '+
   w.map(function(s){return s.key+"팀"}).join(", ")+' · 1인당 '+won(Math.floor(g.prize/Math.max(1,cnt)))+'</p>'):"";
  var itbl='<table><thead><tr><th>순위와 이름</th><th>편</th><th>점수</th></tr></thead><tbody>'+
   ind.map(function(x){return '<tr'+(x.rank===1?' class="gold"':'')+'><td>'+
    (x.rank===1?'<span class="star">\ud83c\udf1f</span> ':'')+(x.tie?"공동 ":"")+x.rank+'위 '+esc(x.name)+
    (x.rank===1?' \ud83c\udf89':'')+'</td>'+
    '<td>'+x.team+'편</td><td>'+(Math.round(x.v*10)/10)+'</td></tr>'}).join("")+
   '</tbody></table>';
  return '<div class="card"><h2>팀전</h2><div class="teambox">'+box+'</div>'+
   '<div style="height:12px"></div>'+itbl+
   '<p class="note">'+(tr.basis==="net"?"핸디 적용 타수를 더해 적은 팀이 이깁니다.":"전달 대비 개선 타수를 더해 많은 팀이 이깁니다.")+
   ' 인원이 맞지 않는 팀은 핸디가 중간인 분의 점수를 두 배로 칩니다.</p>'+prize+'</div>'}
 var rows=gameRows(r,g.type);
 if(!rows.length)return '<div class="card"><h2>'+G.name+'</h2><div class="empty">아직 계산할 기록이 없습니다.'+
  (G.need==="hole"?'<br>홀별 타수가 필요합니다.':'')+'</div></div>';
 var w=rows.filter(function(x){return x.rank===1});
 var prize2=g.prize?('<p class="note">상금 '+won(g.prize)+' · '+esc(w.map(function(x){return x.name}).join(", "))+
  ' '+(w.length>1?('각 '+won(Math.floor(g.prize/w.length))):won(g.prize))+'</p>'):"";
 var showHcp=(g.type==="net"||g.type==="perio");
 var showGross=(g.type==="net"||g.type==="perio"||g.type==="improve");
 var LBL={gross:"타수",net:"네트",perio:"네트",improve:"개선",dapa:"개수",birdie:"개수",onion:"개수"};
 return '<div class="card"><h2>'+G.name+(g.type==="perio"&&r.perio?' <span class="mt">숨은 홀 '+r.perio.join(",")+'</span>':'')+'</h2>'+
  '<table><thead><tr><th>순위와 이름</th>'+(showGross?'<th>타수</th>':'')+(showHcp?'<th>핸디</th>':'')+
  '<th>'+(LBL[g.type]||"결과")+'</th></tr></thead><tbody>'+
  rows.map(function(x){return '<tr'+(x.rank===1?' class="gold"':'')+'><td>'+
   (x.rank===1?'<span class="star">\ud83c\udf1f</span> ':'')+(x.tie?"공동 ":"")+x.rank+'위 '+esc(x.name)+
   (x.rank===1?' \ud83c\udf89':'')+'</td>'+
   (showGross?'<td>'+(x.gross==null?"-":x.gross)+'</td>':'')+
   (showHcp?'<td>'+x.hcp+'</td>':'')+
   '<td>'+(g.type==="improve"?sgn(x.v):x.v)+G.unit+'</td></tr>'}).join("")+
  '</tbody></table><p class="note">'+G.desc+'</p>'+prize2+'</div>'}

 return "이 스코어카드 이미지를 읽어서 아래 형식으로만 출력해 주세요. 설명이나 다른 문장은 붙이지 마세요.\n"+

  (S.members[0]?S.members[0].name:"홍길동")+" 5 4 4 6 5 4 3 5 6 5 4 5 6 4 5 4 6 5"}
function scrScan(){
 var r=round(view.rid);if(!r)return scrHome();
 if(scan&&scan.rid===r.id)return scanConfirm(r);
 return '<div class="screen"><div class="bar"><button class="chip" onclick="go(\'result\',{rid:\''+r.id+'\'})">뒤로</button>'+
 '<h1>스코어카드 읽기</h1></div><div class="body">'+
 '<div class="card"><h2>1. 지시문 복사</h2>'+
 '<p class="note">복사해서 스코어카드 사진과 함께 인공지능에 넣으시면 우리 형식에 맞는 글이 나옵니다.</p>'+
 '<div style="height:10px"></div><textarea readonly id="pt">'+esc(promptText(r))+'</textarea>'+

function copyText(t){
 if(navigator.clipboard&&navigator.clipboard.writeText)
  navigator.clipboard.writeText(t).then(function(){toast("복사했습니다.")},function(){toast("길게 눌러 복사해 주세요.")});
 else toast("길게 눌러 복사해 주세요.")}
function normName(s){return String(s).replace(/\s/g,"").toLowerCase()}
function matchMember(raw,pool){var n=normName(raw);
 for(var i=0;i<pool.length;i++)if(normName(mname(pool[i]))===n)return pool[i];
 for(var j=0;j<pool.length;j++){var x=normName(mname(pool[j]));if(x.indexOf(n)===0||n.indexOf(x)===0)return pool[j]}
 for(var k=0;k<pool.length;k++){var y=normName(mname(pool[k]));
  if(y.length&&n.length&&y[0]===n[0]&&Math.abs(y.length-n.length)<=1)return pool[k]}
 return null}
function parseScan(){
 var r=round(view.rid),txt=document.getElementById("sc").value;
 if(!txt.trim()){toast("붙여 넣은 글이 없습니다.");return}
 var rows=[],pars=null,pool=r.players.slice();
 txt.split(/\r?\n/).forEach(function(ln){
  if(!ln.trim())return;
  var head=ln.trim().split(/[\s,|\t]+/)[0];
  var nums=ln.trim().slice(head.length).match(/(\d+|\?|-)/g)||[];
  if(nums.length<Math.min(5,r.holeCount))return;
  var vals=nums.slice(0,r.holeCount).map(function(x){
   if(x==="?"||x==="-")return null;var v=parseInt(x,10);return isNaN(v)?null:v});
  if(/^par$/i.test(head)||/파/.test(head)){pars=vals;return}
  var mid=matchMember(head,pool);
  rows.push({raw:head,mid:mid,vals:vals});
  if(mid)pool=pool.filter(function(x){return x!==mid})});
 if(!rows.length){toast("사람 줄을 찾지 못했습니다.");return}
 scan={rid:r.id,rows:rows,pars:pars};render()}
function scanConfirm(r){
 var body=scan.rows.map(function(row,ri){
  var sel='<select onchange="scanSetMember('+ri+',this.value)"><option value="">(넣지 않음)</option>'+
   r.players.map(function(mid){return '<option value="'+mid+'"'+(row.mid===mid?" selected":"")+'>'+esc(mname(mid))+'</option>'}).join("")+'</select>';
  var cells=row.vals.map(function(v,i){
   return '<td><input type="number" min="1" inputmode="numeric" value="'+(v==null?"":v)+
    '" onchange="scanSetVal('+ri+','+i+',this.value)"></td>'}).join("");
  return '<tr><td style="min-width:140px">'+sel+'<div class="mt">읽은 이름: '+esc(row.raw)+'</div></td>'+cells+'</tr>'}).join("");
 var head='<tr><th>이름</th>'+r.pars.map(function(p,i){return '<th>'+(i+1)+'<br><span class="mt">파'+p+'</span></th>'}).join("")+'</tr>';
 return '<div class="screen"><div class="bar"><button class="chip" onclick="scan=null;render()">다시</button><h1>읽은 내용 확인</h1></div>'+
 '<div class="body"><div class="card"><h2>확인하고 고치기</h2>'+
 '<p class="note">1과 7, 4와 9를 자주 헷갈립니다. 눈으로 한 번 훑어 주세요.</p>'+
 '<div class="scroll ed"><table class="hx"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>'+
 (scan.pars?'<div class="card"><label style="display:flex;align-items:center;gap:10px;margin:0">'+
  '<input type="checkbox" id="usepar" checked style="width:22px;height:22px"> 카드에 적힌 파를 이 라운드의 파로 삼기</label>'+
  '<p class="note">읽은 파 배열: '+scan.pars.join(" ")+'</p></div>'
  :'<div class="card"><p class="note">카드에서 파 줄을 찾지 못했습니다. 파가 없으면 버디킹과 다파상과 어니언킹이 계산되지 않으니, 입력 화면에서 홀마다 파를 골라 주십시오.</p></div>')+
 '</div><div class="foot"><button class="btn" onclick="applyScan()">이 내용으로 저장</button></div></div>'}
function scanSetMember(ri,mid){scan.rows[ri].mid=mid||null}
function scanSetVal(ri,i,v){var n=parseInt(v,10);scan.rows[ri].vals[i]=isNaN(n)?null:n}
function applyScan(){
 var r=round(scan.rid);if(!r){scan=null;render();return}
 var cb=document.getElementById("usepar");
 if(cb&&cb.checked&&scan.pars)for(var i=0;i<r.holeCount;i++)
  if(typeof scan.pars[i]==="number")r.pars[i]=scan.pars[i];
 var n=0;
 scan.rows.forEach(function(row){if(!row.mid)return;
  row.vals.forEach(function(v,i){if(typeof v!=="number")return;
   setCell(r,row.mid,i+1,{s:v,st:"ok"});n++});
  if(hasHoles(r,row.mid))delete r.grossOnly[row.mid]});
 r.confirmed=true;save();var rid=r.id;scan=null;go("result",{rid:rid});
 toast(n+"개 칸을 저장했습니다.")}

/* ---- 연간 ---- */
function scrYear(){
 var years={};S.rounds.forEach(function(r){var y=(r.date||"").slice(0,4);if(y)years[y]=true});
 var ys=Object.keys(years).sort().reverse();
 var y=view.year||ys[0]||String(new Date().getFullYear());
 var rs=S.rounds.filter(function(r){return (r.date||"").indexOf(y)===0});
 var acc={};
 function A(mid){if(!acc[mid])acc[mid]={mid:mid,name:mname(mid),prize:0,last:0,wins:0,
  dapa:0,birdie:0,onion:0,improve:0,rounds:0};return acc[mid]}
 rs.forEach(function(r){
  r.players.forEach(function(mid){A(mid).rounds++});
  ["dapa","birdie","onion"].forEach(function(t){
   r.players.forEach(function(mid){if(hasHoles(r,mid))A(mid)[t]+=countType(r,mid,t)})});
  r.players.forEach(function(mid){var im=improveOf(r,mid);if(im!=null&&im>0)A(mid).improve+=im});
  roundGames(r).forEach(function(g){
   if(g.type==="team"){
    var tr=teamResult(r,g);if(!tr)return;
    var w=tr.sides.filter(function(s){return s.rank===1}),cnt=0;
    w.forEach(function(s){cnt+=s.rows.length});
    if(!cnt)return;
    w.forEach(function(s){s.rows.forEach(function(x){
     A(x.mid).wins++;if(g.prize)A(x.mid).prize+=Math.floor(g.prize/cnt)})});
    return}
   var rows=gameRows(r,g.type);if(!rows.length)return;
   var w=rows.filter(function(x){return x.rank===1});
   w.forEach(function(x){A(x.mid).wins++;if(g.prize)A(x.mid).prize+=Math.floor(g.prize/w.length)})});
  var nr=gameRows(r,"net");
  if(nr.length){var mx=nr[nr.length-1].rank;
   nr.filter(function(x){return x.rank===mx}).forEach(function(x){A(x.mid).last++})}});
 var arr=Object.keys(acc).map(function(k){return acc[k]});
 function tbl(title,key,unit,desc){
  var a=arr.filter(function(x){return x[key]>0}).sort(function(p,q){return q[key]-p[key]});
  if(!a.length)return '<div class="card"><h2>'+title+'</h2><div class="empty">기록 없음</div></div>';
  return '<div class="card"><h2>'+title+'</h2><table><tbody>'+
   a.map(function(x,i){return '<tr><td>'+(i+1)+'. '+esc(x.name)+'</td><td class="'+(i===0?"win":"")+'">'+
    (unit==="원"?won(x[key]):x[key]+unit)+'</td></tr>'}).join("")+'</tbody></table>'+
   (desc?'<p class="note">'+desc+'</p>':'')+'</div>'}
 var hc=S.members.map(function(m){
  var inY=sortedRounds().filter(function(r){return (r.date||"").indexOf(y)===0&&r.players.indexOf(m.id)>=0});
  var mine=sortedRounds().filter(function(r){return r.players.indexOf(m.id)>=0});
  if(!inY.length||!mine.length)return{name:m.name,year:0,all:0};
  var startH=hcpAt(m.id,inY[0].date,inY[0].id);
  var firstH=hcpAt(m.id,mine[0].date,mine[0].id);
  return{name:m.name,year:startH-curHcp(m.id),all:firstH-curHcp(m.id)}});
 function hcTbl(title,key,desc){
  var a=hc.filter(function(x){return x[key]>0}).sort(function(p,q){return q[key]-p[key]});
  if(!a.length)return '<div class="card"><h2>'+title+'</h2><div class="empty">줄어든 분이 없습니다.</div>'+
   '<p class="note">'+desc+'</p></div>';
  return '<div class="card"><h2>'+title+'</h2><table><tbody>'+
   a.map(function(x,i){return '<tr><td>'+(i+1)+'. '+esc(x.name)+'</td><td class="'+(i===0?"win":"")+'">'+x[key]+'만큼</td></tr>'}).join("")+
   '</tbody></table><p class="note">'+desc+'</p></div>'}
 var sel=ys.map(function(v){return '<button class="chip'+(v===y?" on":"")+'" onclick="go(\'year\',{year:\''+v+'\'})">'+v+'</button>'}).join(" ");
 return '<div class="screen"><div class="bar"><button class="chip" onclick="go(\'home\')">뒤로</button><h1>'+y+'년 집계</h1></div>'+
 '<div class="body">'+(ys.length>1?'<div class="card">'+sel+'</div>':'')+
 '<div class="card"><h2>라운드</h2><p class="note">'+rs.length+'회</p></div>'+
 tbl("상금왕","prize","원","그해 각 게임에서 1등으로 받은 상금의 합계입니다.")+
 tbl("우승 횟수","wins","회","종목별 1등을 합친 횟수입니다. 팀전은 이긴 팀 모두에게 셉니다.")+
 tbl("개선 누적","improve","타","직전 라운드보다 줄인 타수를 모두 더한 것입니다.")+
 tbl("다파상 누적","dapa","홀","")+tbl("버디킹 누적","birdie","홀","")+tbl("어니언킹 누적","onion","홀","")+
 tbl("꼴찌왕","last","회","핸디 적용 순위에서 꼴찌를 한 횟수입니다.")+
 hcTbl("올해 핸디를 줄인 순서","year","올해 첫 라운드 때 핸디와 지금 핸디의 차이입니다.")+
 hcTbl("처음부터 핸디를 줄인 순서","all","모임에 들어온 첫 라운드 때 핸디와 지금 핸디의 차이입니다.")+
 '</div></div>'}

 '</div></div>'}
